name: Build Flutter APKs

# Builds release APKs for both user_app and partner_app.
# - Triggers on push to main, PRs to main, manual dispatch, and tags v*.
# - Uses Flutter SDK from subosito/flutter-action.
# - Uploads APKs as GitHub Actions artifacts + attaches to GitHub Releases (on tags).

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/user_app/**'
      - 'apps/partner_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/user_app/**'
      - 'apps/partner_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        type: choice
        default: 'both'
        options:
          - user_app
          - partner_app
          - both

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - user_app
          - partner_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.3'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Bootstrap project (regenerate any missing Android files)
        working-directory: apps/${{ matrix.app }}
        run: flutter create . --platforms=android --org com.delivery --project-name ${{ matrix.app }}

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Verify analysis (non-blocking)
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (release)
        working-directory: apps/${{ matrix.app }}
        env:
          API_BASE_URL: ${{ secrets.FLUTTER_API_BASE_URL }}
          API_KEY: ${{ secrets.FLUTTER_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.FLUTTER_GOOGLE_MAPS_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"

      - name: Rename APK
        working-directory: apps/${{ matrix.app }}/build/app/outputs/flutter-apk
        run: |
          cp app-release.apk ${{ matrix.app }}-${{ github.sha }}.apk
          ls -lh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/${{ matrix.app }}-*.apk
          retention-days: 30
          compression-level: 0

      - name: Attach APK to GitHub Release (on tags)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/${{ matrix.app }}-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}
    steps:
      - name: Report
        run: |
          echo "## Flutter APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| user_app | ${{ needs.build.result == 'success' && 'success' || 'failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| partner_app | ${{ needs.build.result == 'success' && 'success' || 'failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APKs are uploaded as artifacts — go to the run page to download them." >> $GITHUB_STEP_SUMMARY
